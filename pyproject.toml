[project]
name = "eda-dataset"
version = "0.1.0"
description = ""
authors = [
    {name = "Emanuele Pietro Cometti",email = "emanuelecometti@hotmail.it"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14.1"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "scikit-image (>=0.24.0,<0.26.0)",
    "opencv-python (>=4.10.0,<5.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "pandas (>=2.2.0,<4.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "tqdm (>=4.67.3,<5.0.0)"
]

[tool.poetry]
packages = [{include = "eda_dataset", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
