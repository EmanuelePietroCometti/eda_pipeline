# Configurazione dell'EDA. Da fissare PRIMA di guardare i risultati (vedi design.md).

dataset:
  fabric: nero
  reference_version: V0            # su questa si fanno maschere e confronti tra versioni
  # Cartelle radice delle tre versioni. Ogni radice contiene train/, test/, ground_truth/.
  versions:
    V0: {path: data\tessuto_quadrettoni, dust_train: false, dust_test: false}
    #V1: {path: data\tessuto_chiaro_dust_validation, dust_train: false, dust_test: true}
    #V2: {path: data\tessuto_chiaro_dust_train, dust_train: true,  dust_test: true}
  good_folder: good
  extensions: [".png", ".bmp", ".jpg", ".jpeg", ".tif", ".tiff"]
  mask_suffix: ""             # [DA CONFERMARE] suffisso del nome della maschera ("" se assente)

general:
  out_dir: results
  seed: 42
  patch_size: 512
  model_input_size: 256

masks:
  threshold: 127
  connectivity: 2
  cell_sizes_px: [8, 16]           # stride di layer2 e layer3 a 256 px

leakage:
  overlap_px: 32
  min_strip_std: 3.0               # strisce piatte (std sotto soglia) non contano come coppie
  phash_max_hamming: 4
  phash_min_corr: 0.98

domain_shift:
  n_bootstrap: 1000
  cv_splits: 5
  pca_components: 20
  n_permutations: 50
  min_n: 20

knn:
  backbone: "resnet18"               # simple | resnet18   [DA CONFERMARE] da fissare in anticipo
  k_values: [1, 5]
  primary_k: 1
  n_bootstrap: 1000

gallery:
  defect_class: "paglia"           # [DA CONFERMARE] il difetto più simile alla polvere
  n_per_class: 12
  n_cols: 4
  crop_px: 160
