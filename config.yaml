# Configurazione dell'EDA (vedi README.md).

dataset:
  fabric: quadrettoni
  reference_version: V0           # versione senza polvere: la polvere delle altre si trova per differenza da questa
  # Cartelle radice delle tre versioni. Ogni radice contiene train/, test/, ground_truth/.
  versions:
    V0: {path: D:\emanuele\Code\dataset\tessuto_quadrettoni}
    #V1: {path: D:\emanuele\Code\dataset\tessuto_nero_dust_validation}
    #V2: {path: D:\emanuele\Code\dataset\tessuto_nero_dust_train}
  good_folder: good
  extensions: [".png", ".bmp", ".jpg", ".jpeg", ".tif", ".tiff"]
  mask_suffix: ""             # [DA CONFERMARE] suffisso del nome della maschera ("" se assente)

general:
  out_dir: results
  seed: 42
  patch_size: 512
  model_input_size: 256

masks:
  threshold: 127
  connectivity: 2                  # 2 = 8-connettività: una componente connessa è un difetto

embedding:
  backbone: "resnet18"             # simple | resnet18   [DA CONFERMARE] da fissare in anticipo

projection:
  methods: [pca, tsne, umap]
  max_per_group: null              # es. 2000: al più 2000 immagini per gruppo e classe
  tsne: {perplexity: 30}
  umap: {n_neighbors: 15, min_dist: 0.1}
